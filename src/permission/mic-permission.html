<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイクの許可 - Multilingual CC</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; }
    h1 { font-size: 1.2rem; }
    #retryButton { margin-top: 1rem; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <h1>マイクの許可</h1>
  <p id="permissionStatus">マイクの許可を要求しています。表示されるダイアログで「許可」を選んでください。</p>
  <button id="retryButton" type="button" hidden>もう一度許可を要求</button>
  <p><small>許可が完了するとこのタブは自動的に閉じます。閉じない場合は、このタブを手動で閉じてください。</small></p>
  <script type="module" src="mic-permission.js"></script>
</body>
</html>
